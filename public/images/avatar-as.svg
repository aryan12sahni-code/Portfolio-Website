<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d4a574"/>
      <stop offset="1" stop-color="#b07a45"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0f3d3a"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1a1410"/>
      <stop offset="1" stop-color="#0a0806"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="70%" r="50%">
      <stop stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#050a0e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="300" cy="620" r="220" fill="url(#glow)"/>
  <!-- shoulders / shirt -->
  <path d="M110 760 C130 520, 470 520, 490 760 Z" fill="url(#shirt)"/>
  <!-- neck -->
  <rect x="255" y="390" width="90" height="80" rx="20" fill="url(#skin)"/>
  <!-- head -->
  <ellipse cx="300" cy="280" rx="118" ry="138" fill="url(#skin)"/>
  <!-- hair volume -->
  <path d="M180 250 C185 140, 415 140, 420 250 C400 175, 200 175, 180 250 Z" fill="url(#hair)"/>
  <path d="M175 260 C170 210, 210 175, 250 170 L240 250 Z" fill="url(#hair)"/>
  <path d="M425 260 C430 210, 390 175, 350 170 L360 250 Z" fill="url(#hair)"/>
  <!-- brows -->
  <path d="M230 255 Q255 242 280 250" stroke="#1a120c" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M320 250 Q345 242 370 255" stroke="#1a120c" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- eyes -->
  <ellipse cx="255" cy="285" rx="16" ry="12" fill="#fff8f0"/>
  <ellipse cx="345" cy="285" rx="16" ry="12" fill="#fff8f0"/>
  <circle cx="257" cy="287" r="7" fill="#5c3310"/>
  <circle cx="347" cy="287" r="7" fill="#5c3310"/>
  <circle cx="259" cy="285" r="2.5" fill="#fff"/>
  <circle cx="349" cy="285" r="2.5" fill="#fff"/>
  <!-- nose -->
  <path d="M300 290 L292 330 Q300 338 308 330 Z" fill="#a86b3d" opacity="0.7"/>
  <!-- mouth -->
  <path d="M270 360 Q300 378 330 360" stroke="#8b4518" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- monogram badge -->
  <circle cx="300" cy="520" r="36" fill="#050a0e" stroke="#2dd4bf" stroke-width="3"/>
  <text x="300" y="532" text-anchor="middle" fill="#2dd4bf" font-family="Syne, Arial, sans-serif" font-size="28" font-weight="700">AS</text>
</svg>
