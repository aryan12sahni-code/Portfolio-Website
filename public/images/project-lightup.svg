<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a1518"/>
      <stop offset="1" stop-color="#0f2a28"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" rx="18" fill="url(#bg)"/>
  <circle cx="320" cy="175" r="90" fill="url(#glow)"/>
  <!-- camera / eye -->
  <rect x="250" y="120" width="140" height="100" rx="18" fill="#121c20" stroke="#2dd4bf" stroke-width="3"/>
  <circle cx="320" cy="170" r="32" fill="#0a1518" stroke="#2dd4bf" stroke-width="3"/>
  <circle cx="320" cy="170" r="14" fill="#2dd4bf"/>
  <circle cx="328" cy="162" r="5" fill="#e8eef2"/>
  <!-- sound waves -->
  <path d="M400 150 Q430 170 400 190" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M415 135 Q460 170 415 205" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M240 150 Q210 170 240 190" stroke="#2dd4bf" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M225 135 Q180 170 225 205" stroke="#2dd4bf" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <text x="320" y="290" text-anchor="middle" fill="#e8eef2" font-family="Syne, Arial, sans-serif" font-size="28" font-weight="700">LightUp</text>
  <text x="320" y="322" text-anchor="middle" fill="#2dd4bf" font-family="DM Sans, Arial, sans-serif" font-size="14" letter-spacing="2">AI VISION ASSISTANT</text>
</svg>
