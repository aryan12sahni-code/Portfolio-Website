<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c5d0d4"/>
      <stop offset="1" stop-color="#8b9a9e"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#12161a"/>
      <stop offset="1" stop-color="#1c252b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="70%" r="50%">
      <stop stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#04090c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="300" cy="620" r="220" fill="url(#glow)"/>
  <path d="M120 760 C140 520, 460 520, 480 760 Z" fill="url(#body)"/>
  <!-- neck -->
  <rect x="250" y="400" width="100" height="70" rx="12" fill="#2a3236"/>
  <!-- head -->
  <rect x="175" y="140" width="250" height="240" rx="36" fill="url(#metal)"/>
  <ellipse cx="300" cy="150" rx="120" ry="55" fill="#9aa8ac"/>
  <!-- visor -->
  <rect x="205" y="230" width="190" height="55" rx="12" fill="#1a2226"/>
  <circle cx="255" cy="257" r="18" fill="#2dd4bf"/>
  <circle cx="345" cy="257" r="18" fill="#2dd4bf"/>
  <circle cx="255" cy="257" r="7" fill="#04120f"/>
  <circle cx="345" cy="257" r="7" fill="#04120f"/>
  <!-- chin led -->
  <rect x="240" y="330" width="120" height="12" rx="6" fill="#2dd4bf"/>
  <!-- antenna -->
  <rect x="360" y="70" width="10" height="70" rx="4" fill="#2a3236"/>
  <circle cx="365" cy="65" r="14" fill="#f59e0b"/>
  <!-- side vents -->
  <rect x="155" y="210" width="18" height="90" rx="4" fill="#2a3236"/>
  <rect x="427" y="210" width="18" height="90" rx="4" fill="#2a3236"/>
  <rect x="160" y="225" width="8" height="10" rx="2" fill="#2dd4bf"/>
  <rect x="160" y="245" width="8" height="10" rx="2" fill="#2dd4bf"/>
  <rect x="160" y="265" width="8" height="10" rx="2" fill="#2dd4bf"/>
  <rect x="432" y="225" width="8" height="10" rx="2" fill="#2dd4bf"/>
  <rect x="432" y="245" width="8" height="10" rx="2" fill="#2dd4bf"/>
  <rect x="432" y="265" width="8" height="10" rx="2" fill="#2dd4bf"/>
</svg>
